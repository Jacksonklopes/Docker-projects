services:

  web:
    build: ./app
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: day34db
      DB_USER: admin
      DB_PASSWORD: secret123
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: day34db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d day34db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine

volumes:
  postgres-data:

networks:
  default:
    name: day34-app-network
